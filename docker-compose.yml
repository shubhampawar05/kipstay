services:
  db:
    image: postgres:16-alpine
    container_name: kipstay-db
    environment:
      POSTGRES_USER: kipstay
      POSTGRES_PASSWORD: kipstay
      POSTGRES_DB: kipstay
    ports:
      - "5433:5432"
    volumes:
      - kipstay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kipstay -d kipstay"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  kipstay-pgdata:
